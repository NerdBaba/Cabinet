<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">How Cabinet organizes and launches games</title>
  <desc id="desc">App Store, Steam, Heroic, CrossOver and custom games flow into one searchable native library, then launch through their platform.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171721"/><stop offset="1" stop-color="#0d0d12"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#7064ff"/><stop offset="1" stop-color="#a58bff"/></linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#756cff"/></marker>
  </defs>
  <rect width="1200" height="440" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" fill="#f4f2ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="650">One shelf for your Mac games</text>
  <text x="54" y="91" fill="#9997a9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">Local discovery · native navigation · platform-aware launch</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" filter="url(#shadow)">
    <rect x="54" y="129" width="253" height="253" rx="20" fill="#20202b" stroke="#343340"/>
    <text x="78" y="163" fill="#aaa7b8" font-size="13" font-weight="600" letter-spacing="1">DISCOVER</text>
    <g font-size="15" fill="#f2f0fa">
      <rect x="76" y="181" width="209" height="34" rx="9" fill="#292936"/><text x="91" y="203">▣  App Store apps</text>
      <rect x="76" y="224" width="209" height="34" rx="9" fill="#292936"/><text x="91" y="246">◉  Steam installs</text>
      <rect x="76" y="267" width="209" height="34" rx="9" fill="#292936"/><text x="91" y="289">◈  Heroic libraries</text>
      <rect x="76" y="310" width="209" height="34" rx="9" fill="#292936"/><text x="91" y="332">◇  CrossOver + custom</text>
    </g>
    <rect x="402" y="129" width="396" height="253" rx="20" fill="#191922" stroke="#494266"/>
    <text x="428" y="163" fill="#aaa7b8" font-size="13" font-weight="600" letter-spacing="1">YOUR LIBRARY</text>
    <rect x="428" y="181" width="344" height="42" rx="11" fill="#24232e" stroke="#383644"/>
    <text x="448" y="208" fill="#aaa7b8" font-size="15">⌕   Search your collection</text>
    <g>
      <rect x="428" y="241" width="94" height="113" rx="11" fill="#32314a"/><path d="M428 285q47-46 94 0v69h-94z" fill="#7468da" opacity=".45"/><text x="475" y="370" text-anchor="middle" fill="#d7d4e3" font-size="11">Browse</text>
      <rect x="553" y="241" width="94" height="113" rx="11" fill="#412324"/><path d="M553 297q47-59 94 0v57h-94z" fill="#d65b56" opacity=".48"/><text x="600" y="370" text-anchor="middle" fill="#d7d4e3" font-size="11">Filter</text>
      <rect x="678" y="241" width="94" height="113" rx="11" fill="#203a36"/><path d="M678 285q47-48 94 0v69h-94z" fill="#48a58d" opacity=".42"/><text x="725" y="370" text-anchor="middle" fill="#d7d4e3" font-size="11">Customize</text>
    </g>
    <rect x="893" y="129" width="253" height="253" rx="20" fill="#20202b" stroke="#343340"/>
    <text x="917" y="163" fill="#aaa7b8" font-size="13" font-weight="600" letter-spacing="1">PLAY</text>
    <circle cx="1019" cy="254" r="46" fill="url(#accent)"/><path d="m1008 233 28 21-28 21z" fill="#fff"/>
    <text x="1019" y="329" text-anchor="middle" fill="#f2f0fa" font-size="17" font-weight="600">Launch in place</text>
    <text x="1019" y="352" text-anchor="middle" fill="#aaa7b8" font-size="12">Steam · Heroic · macOS · shell</text>
  </g>
  <path d="M322 255h63" fill="none" stroke="#756cff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M813 255h63" fill="none" stroke="#756cff" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>

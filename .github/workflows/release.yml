name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v)'
        required: false
        default: '1.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=1.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        run: swift test

      - name: Build release
        run: ./script/build_release.sh "${{ steps.version.outputs.value }}"
        env:
          CARTRIDGES_BUILD_CONFIGURATION: release

      - name: Verify bundle
        run: |
          test -x ../Cabinet.app/Contents/MacOS/Cabinet
          /usr/bin/plutil -lint ../Cabinet.app/Contents/Info.plist
          ls -lh Cabinet-*.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cabinet-macOS-${{ steps.version.outputs.value }}
          path: Cabinet-*.dmg

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Cabinet-*.dmg
          generate_release_notes: true
          draft: false
